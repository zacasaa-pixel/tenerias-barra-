<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenerías - Logística Almacén</title>
    <style>
        :root {
            --gold: #c5a059;
            --dark: #000000;
            --gray-card: #121212;
            --border: #2a2a2a;
        }

        body {
            font-family: 'Garamond', serif;
            background-color: var(--dark);
            color: #f1f1f1;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        .header h1 {
            letter-spacing: 8px;
            font-weight: 300;
            margin: 0;
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            max-width: 1200px;
            margin: auto;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1.5fr;
            }
        }

        .card {
            background: var(--gray-card);
            padding: 30px;
            border: 1px solid var(--border);
            border-top: 3px solid var(--gold);
        }

        h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #888; }

        input, select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--gold);
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover { background: #e2bd75; opacity: 0.9; }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 400px;
        }

        th { border-bottom: 1px solid var(--gold); padding: 12px; text-align: left; color: var(--gold); }
        td { padding: 12px; border-bottom: 1px solid #222; }

        .stock-final { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>TENERÍAS</h1>
    <p>LOGÍSTICA DE ALMACÉN | MONTERREY N.L.</p>
</div>

<div class="grid">
    <div class="card">
        <h2>Registro de Movimiento</h2>
        <div class="form-group">
            <label>Producto</label>
            <input type="text" id="prod" placeholder="Ej. Tequila Maestro Dobel">
        </div>
        <div class="form-group">
            <label>Cantidad (Botellas/Unidades)</label>
            <input type="number" id="cant" placeholder="0">
        </div>
        <div class="form-group">
            <label>Acción</label>
            <select id="accion">
                <option value="entrada">Entra al Almacén (+)</option>
                <option value="salida">Sale a Barra (-)</option>
            </select>
        </div>
        <button id="btnRegistrar">Registrar Movimiento</button>
    </div>

    <div class="card">
        <h2>Inventario al Cierre</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Entradas</th>
                        <th>Salidas</th>
                        <th>Stock Final</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                </tbody>
            </table>
        </div>
        <br>
        <button id="btnExportar" style="background:transparent; border:1px solid var(--gold); color:var(--gold);">
            Exportar Corte (CSV)
        </button>
    </div>
</div>

<script>
    // Variable global
    let inventario = {};

    function registrar() {
        const prodInput = document.getElementById('prod');
        const cantInput = document.getElementById('cant');
        const prod = prodInput.value.trim().toUpperCase();
        const cant = parseInt(cantInput.value);
        const accion = document.getElementById('accion').value;

        if(!prod || isNaN(cant) || cant <= 0) {
            alert("Por favor, ingrese un producto y una cantidad válida.");
            return;
        }

        if(!inventario[prod]) {
            inventario[prod] = { entradas: 0, salidas: 0 };
        }

        if(accion === 'entrada') {
            inventario[prod].entradas += cant;
        } else {
            inventario[prod].salidas += cant;
        }

        renderTabla();
        
        // Limpiar
        prodInput.value = "";
        cantInput.value = "";
        prodInput.focus();
    }

    function renderTabla() {
        const body = document.getElementById('tablaBody');
        body.innerHTML = "";
        
        for (let p in inventario) {
            let total = inventario[p].entradas - inventario[p].salidas;
            let fila = document.createElement('tr');
            fila.innerHTML = `
                <td>${p}</td>
                <td>${inventario[p].entradas}</td>
                <td>${inventario[p].salidas}</td>
                <td class="stock-final">${total}</td>
            `;
            body.appendChild(fila);
        }
    }

    function exportarCSV() {
        if (Object.keys(inventario).length === 0) {
            alert("No hay datos para exportar");
            return;
        }

        let csv = "Producto,Entradas,Salidas,Stock Final\n";
        for (let p in inventario) {
            let total = inventario[p].entradas - inventario[p].salidas;
            csv += `${p},${inventario[p].entradas},${inventario[p].salidas},${total}\n`;
        }
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', 'Cierre_Almacen_Tenerias.csv');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // Usamos Event Listeners en lugar de 'onclick' en el HTML para evitar errores de lectura
    document.getElementById('btnRegistrar').addEventListener('click', registrar);
    document.getElementById('btnExportar').addEventListener('click', exportarCSV);

</script>

</body>
</html>
